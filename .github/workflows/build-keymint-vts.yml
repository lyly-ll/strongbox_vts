name: Build Android 17 KeyMint VTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check workspace capacity
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          test "$(df --output=avail -k / | tail -n 1)" -gt 50000000

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod 0755 "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Initialize Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android
          cd android
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-latest-release \
            --repo-url=https://googlesource.com \
            --depth=1 \
            --no-clone-bundle \
            --no-use-superproject

      - name: Sync Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          # 【核心破局】：在 sync 后面必须显式“点名”只同步这 6 个编译大脑与安全接口仓，体积暴降 90%
          repo sync \
            -c \
            -j4 \
            --no-clone-bundle \
            --no-tags \
            --force-sync \
            --current-branch \
            --depth=1 \
            build/make \
            platform/build/soong \
            platform/build/blueprint \
            platform/test/vts \
            platform/hardware/interfaces \
            platform/system/keymint

      - name: Build KeyMint VTS target
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          source build/envsetup.sh
          lunch aosp_arm64-userdebug
          # 【名称修正】：Android 17 标准单模块编译名称已变更为 VtsHalKeyMintTargetTest
          m -j"$(nproc)" VtsHalKeyMintTargetTest

      - name: Collect VTS binary
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          mkdir -p ../keymint-vts-artifact
          # 配合新模块名自动匹配并提取精准 C++ 二进制文件与配置
          mapfile -t binaries < <(find out -type f -name VtsHalKeyMintTargetTest -perm -0100)
          test "${#binaries[@]}" -gt 0
          printf '%s\n' "${binaries[@]}"
          cp "${binaries[0]}" ../keymint-vts-artifact/VtsHalKeyMintTargetTest
          sha256sum ../keymint-vts-artifact/VtsHalKeyMintTargetTest \
            > ../keymint-vts-artifact/SHA256SUMS
          cp hardware/interfaces/security/keymint/aidl/vts/functional/Android.bp \
            ../keymint-vts-artifact/Android.bp
          cp hardware/interfaces/security/keymint/aidl/vts/functional/AndroidTest.xml \
            ../keymint-vts-artifact/AndroidTest.xml

      - name: Upload KeyMint VTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-17-keymint-vts-${{ github.sha }}
          path: keymint-vts-artifact/
          if-no-files-found: error
          retention-days: 7
