name: Build Android 17 KeyMint VTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check workspace capacity
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          test "$(df --output=avail -k / | tail -n 1)" -gt 50000000

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod 0755 "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Initialize Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android
          cd android
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-17.0.0_r1 \
            --repo-url=https://gerrit.googlesource.com/git-repo \
            --repo-rev=stable \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-clone-bundle \
            --no-use-superproject

      - name: Sync Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          repo sync \
            -c \
            -j4 \
            --no-clone-bundle \
            --no-tags \
            --force-sync \
            prebuilts/build-tools \
            prebuilts/siso \
            prebuilts/go/linux-x86 \
            prebuilts/rust \
            prebuilts/rust-toolchain/linux-x86 \
            prebuilts/vndk/v31 \
            prebuilts/vndk/v32 \
            prebuilts/vndk/v33 \
            prebuilts/vndk/v34 \
            build/make \
            build/soong \
            build/blueprint \
            build/release \
            toolchain/pgo-profiles \
            test/vts \
            test/app_compat/csuite \
            hardware/interfaces \
            system/hardware/interfaces \
            system/keymint \
            system/keymaster \
            system/tools/aidl \
            system/tools/hidl \
            system/tools/xsdc \
            kernel/configs \
            system/sepolicy \
            system/apex \
            packages/modules/common \
            packages/modules/NeuralNetworks \
            packages/modules/Media \
            system/core \
            system/libbase \
            system/libhidl \
            system/libhwbinder \
            system/libvintf \
            external/boringssl \
            external/googletest \
            external/golang-protobuf \
            external/go-cmp \
            external/pogreb \
            external/starlark-go \
            frameworks/native \
            frameworks/base
          test -x prebuilts/siso/linux-x86/siso
          ls -lh prebuilts/siso/linux-x86/siso

      - name: Prune unrelated framework test blueprints
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          # frameworks/base is synced for core defaults; its unrelated test blueprints
          # pull in CTS/Connectivity/Mockito modules that are not needed by KeyMint VTS.
          rm -f frameworks/native/services/surfaceflinger/Android.bp
          rm -f frameworks/native/libs/ipcrenderbuffer/tests/Android.bp
          rm -f frameworks/native/libs/ipcrenderbuffer/Android.bp
          rm -f system/apex/tools/Android.bp
          rm -f frameworks/native/services/surfaceflinger/fuzzer/Android.bp
          rm -f hardware/interfaces/automotive/vehicle/aidl/impl/3/Android.bp
          rm -f hardware/interfaces/automotive/vehicle/aidl/impl/current/fake_impl/GeneratorHub/Android.bp
          rm -f hardware/interfaces/security/secretkeeper/aidl/vts/Android.bp
          rm -f system/apex/tools/apex-ls/Android.bp
          rm -f hardware/interfaces/automotive/vehicle/aidl/impl/current/Android.bp
          find hardware/interfaces/automotive/vehicle/aidl/impl -type f -name Android.bp -print -delete
          rm -f hardware/interfaces/automotive/vehicle/aidl/aidl_test/Android.bp
          find frameworks/native/services/surfaceflinger -type f -name Android.bp -print -delete
          # Bulk-prune unrelated Android.bp trees; retain KeyMint/AIDL/Binder/VTS core paths.
          find hardware/interfaces -path '*/vts/*' -type f -name Android.bp \
            ! -path 'hardware/interfaces/security/keymint/*' -print -delete
          find frameworks/native -path '*/tests/*' -type f -name Android.bp -print -delete
          find system/core -path '*/tests/*' -type f -name Android.bp -print -delete
          find hardware/interfaces -path '*/benchmark/*' -type f -name Android.bp -print -delete
          find frameworks/native -path '*/benchmark/*' -type f -name Android.bp -print -delete
          find frameworks/base -path '*/benchmark/*' -type f -name Android.bp -print -delete
          find hardware/interfaces/automotive -type f -name Android.bp -print -delete
          find hardware/interfaces/security/see -type f -name Android.bp -print -delete
          find hardware/interfaces/security/secretkeeper -type f -name Android.bp -print -delete
          find hardware/interfaces -path '*/fuzzer/*' -type f -name Android.bp -print -delete
          find system/core hardware/interfaces -type f -name Android.bp -print0 | xargs -0 grep -lZ -E 'service_fuzzer_defaults|fuzzer_disable_leaks' | xargs -0 -r rm -v
          find packages frameworks system hardware -type f -name Android.bp -print0 | xargs -0 grep -lZ -E 'service_fuzzer_defaults(_rs)?|fuzzer_disable_leaks' | xargs -0 -r rm -v
          find frameworks/base frameworks/native system/core hardware/interfaces packages/modules/NeuralNetworks -type f -name Android.bp -print0 | xargs -0 grep -lZ -E 'AndroidLintCheckerTestDefaults|cts_defaults|rdroidtest\.defaults|BroadcastRadioHalDefaults|modules-utils-extended-mockito-rule-defaults|framework-(wifi|connectivity)-test-defaults' | xargs -0 -r rm -v
          find hardware/interfaces/broadcastradio -path '*/test/*' -type f -name Android.bp -print -delete
          find frameworks/native -path '*/fuzzer/*' -type f -name Android.bp -print -delete
          find frameworks/base -path '*/fuzzer/*' -type f -name Android.bp -print -delete
          find system/apex/tools -type f -name Android.bp -print -delete
          find frameworks/native/services/surfaceflinger -type f -name Android.bp -print -delete
          find frameworks/native/libs/tonemap -type f -name Android.bp -print -delete
          find frameworks/native/libs/ipcrenderbuffer -type f -name Android.bp -print -delete
          find frameworks/native/libs/shaders/tests -type f -name Android.bp -print -delete
          rm -f system/core/trusty/secretkeeper/Android.bp
          rm -f system/libhidl/transport/base/1.0/vts/functional/Android.bp
          rm -f system/core/rootdir/tests/RlimitTest/Android.bp
          rm -f frameworks/native/libs/renderengine/Android.bp
          find frameworks/native/libs/renderengine -type f -name Android.bp -print -delete
          rm -f frameworks/base/libs/hwui/Android.bp
          find hardware/interfaces/graphics -path '*/vts/*' -type f -name Android.bp -print -delete
          rm -f frameworks/base/media/jni/audioeffect/Android.bp
          find build/make/tools/ide_query -type f -name Android.bp -print -delete
          rm -f build/soong/java/core-libraries/Android.bp
          find frameworks/base -type f -name Android.bp -print0 | xargs -0 grep -lZ -E 'api\.combined\.(public|system|test)\.latest' | xargs -0 -r rm -v
          git -C frameworks/base checkout -- api/Android.bp
          rm -f frameworks/base/native/graphics/jni/Android.bp
          rm -f frameworks/base/packages/SettingsProvider/Android.bp
          rm -f frameworks/base/tools/protologtool/lint/Android.bp
          rm -f frameworks/base/packages/SystemUI/checks/Android.bp
          rm -f frameworks/base/media/jni/Android.bp
          rm -f frameworks/native/libs/tonemap/tests/Android.bp
          rm -f build/make/tools/ide_query/cc_analyzer/Android.bp
          rm -f system/core/init/Android.bp
          rm -f hardware/interfaces/automotive/remoteaccess/hal/default/test/Android.bp
          rm -f hardware/interfaces/security/see/hwcrypto/aidl/vts/functional/Android.bp
          rm -f hardware/interfaces/automotive/remoteaccess/hal/default/Android.bp
          rm -f system/core/debuggerd/Android.bp
          rm -f hardware/interfaces/virtualization/capabilities_service/vts/Android.bp
          find frameworks/base \
            \( -path '*/tests/*' -o -path '*/test/*' -o -path '*/tools/lint/*' \) \
            -type f -name Android.bp -print -delete


      - name: Build KeyMint VTS target
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-userdebug
          m -j"$(nproc)" VtsAidlKeyMintTargetTest

      - name: Collect VTS binary
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          mkdir -p ../keymint-vts-artifact
          mapfile -t binaries < <(find out -type f -name VtsAidlKeyMintTargetTest -perm -0100)
          test "${#binaries[@]}" -gt 0
          printf '%s\n' "${binaries[@]}"
          cp "${binaries[0]}" ../keymint-vts-artifact/VtsAidlKeyMintTargetTest
          sha256sum ../keymint-vts-artifact/VtsAidlKeyMintTargetTest \
            > ../keymint-vts-artifact/SHA256SUMS
          cp security/keymint/aidl/vts/functional/Android.bp \
            ../keymint-vts-artifact/Android.bp
          cp security/keymint/aidl/vts/functional/AndroidTest.xml \
            ../keymint-vts-artifact/AndroidTest.xml

      - name: Upload KeyMint VTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-17-keymint-vts-${{ github.sha }}
          path: keymint-vts-artifact/
          if-no-files-found: error
          retention-days: 7
