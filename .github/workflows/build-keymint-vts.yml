name: Build Android 17 KeyMint VTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check workspace capacity
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          test "$(df --output=avail -k / | tail -n 1)" -gt 50000000

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod 0755 "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Initialize Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android
          cd android
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-17.0.0_r1 \
            --repo-url=https://gerrit.googlesource.com/git-repo \
            --repo-rev=stable \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-clone-bundle \
            --no-use-superproject

      - name: Sync Android 17 source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          repo sync \
            -c \
            -j4 \
            --no-clone-bundle \
            --no-tags \
            --force-sync \
            prebuilts/build-tools \
            prebuilts/siso \
            prebuilts/go/linux-x86 \
            prebuilts/vndk/v31 \
            prebuilts/vndk/v32 \
            prebuilts/vndk/v33 \
            prebuilts/vndk/v34 \
            build/make \
            build/soong \
            build/blueprint \
            build/release \
            toolchain/pgo-profiles \
            test/vts \
            test/app_compat/csuite \
            hardware/interfaces \
            system/keymint \
            system/keymaster \
            system/tools/aidl \
            system/tools/hidl \
            system/tools/xsdc \
            kernel/configs \
            system/sepolicy \
            system/apex \
            packages/modules/common \
            packages/modules/NeuralNetworks \
            system/core \
            system/libbase \
            system/libhidl \
            system/libvintf \
            platform_testing \
            external/boringssl \
            external/googletest \
            external/golang-protobuf \
            external/go-cmp \
            external/pogreb \
            external/starlark-go \
            frameworks/native \
            frameworks/base \
            frameworks/av
          test -x prebuilts/siso/linux-x86/siso
          ls -lh prebuilts/siso/linux-x86/siso

      - name: Build KeyMint VTS target
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-userdebug
          m -j"$(nproc)" VtsAidlKeyMintTargetTest

      - name: Collect VTS binary
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          mkdir -p ../keymint-vts-artifact
          mapfile -t binaries < <(find out -type f -name VtsAidlKeyMintTargetTest -perm -0100)
          test "${#binaries[@]}" -gt 0
          printf '%s\n' "${binaries[@]}"
          cp "${binaries[0]}" ../keymint-vts-artifact/VtsAidlKeyMintTargetTest
          sha256sum ../keymint-vts-artifact/VtsAidlKeyMintTargetTest \
            > ../keymint-vts-artifact/SHA256SUMS
          cp security/keymint/aidl/vts/functional/Android.bp \
            ../keymint-vts-artifact/Android.bp
          cp security/keymint/aidl/vts/functional/AndroidTest.xml \
            ../keymint-vts-artifact/AndroidTest.xml

      - name: Upload KeyMint VTS artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-17-keymint-vts-${{ github.sha }}
          path: keymint-vts-artifact/
          if-no-files-found: error
          retention-days: 7
